services:
  native-journal-relay:
    image: node@sha256:be8204d4bd327363357f532187b752ff62759c31bedf98e9e18fc08c9cbd605c
    user: node
    command: ["node", "/etc/facade/native-journal-relay.mjs"]
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 128m
    cpuset: "0-3"
    volumes:
      - ./native-journal-relay.mjs:/etc/facade/native-journal-relay.mjs:ro
    networks:
      private:
        interface_name: priv0
      host-channel:
        gw_priority: 1
networks:
  private:
    internal: true
  host-channel: {}
